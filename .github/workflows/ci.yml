name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    uses: Melodymaifafa/gh-workflows/.github/workflows/ci.yml@v1
    with:
      runtime: node
      install_cmd: 'corepack enable && pnpm install --frozen-lockfile'
      lint_cmd: 'pnpm typecheck'
      test_cmd: 'pnpm test && pnpm build'
